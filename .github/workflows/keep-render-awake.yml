name: Keep Render Services Awake

on:
  schedule:
    # Run every 10 minutes to prevent Render free tier from sleeping (sleeps after 15m)
    - cron: "*/10 * * * *"
  workflow_dispatch: # Allows you to trigger it manually

jobs:
  ping-services:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Backend API
        # Pings the /health endpoint (or root) and ignores failures so the workflow doesn't fail
        run: |
          curl -sSf https://ai-sales-bot-api-vdr6.onrender.com/health || curl -sSf https://ai-sales-bot-api-vdr6.onrender.com || echo "Backend API ping returned non-200, but ping was sent."

      - name: Ping WhatsApp Gateway
        # Pings the whatsapp gateway
        run: |
          curl -sSf https://ai-sales-bot-whatsapp-vdr6.onrender.com/health || curl -sSf https://ai-sales-bot-whatsapp-vdr6.onrender.com || echo "WhatsApp gateway ping returned non-200, but ping was sent."
