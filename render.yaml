services:
  # ─────────────────────────────────────────────
  # 1. Backend API (FastAPI + Celery in one process)
  # Workers not available on free plan — Celery runs
  # as a background thread inside the web dyno.
  # ─────────────────────────────────────────────
  - type: web
    name: ai-sales-bot-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >
      sh -c "python -m alembic upgrade head &&
             celery -A app.workers.celery_app worker --loglevel=info --concurrency=1 --detach &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: TESTING_MODE
        value: false
      # ── Databases (Supabase) ──
      - key: AUTH_DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      # ── Security ──
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      # ── Redis ──
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      # ── AI Keys ──
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # ── CORS ──
      - key: CORS_ORIGINS
        value: https://ai-sales-bot.onrender.com
      # ── Feature Flags ──
      - key: ENABLE_SUBSCRIPTION_LIMITS
        value: true
      - key: ENABLE_OVERAGE_BILLING
        value: true
      # ── Rate Limiting ──
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      # NOTE: Per-user integrations (Telegram, WhatsApp, Shopify, etc.)
      # are stored in the database per project/user — NOT as env vars here.

  # ─────────────────────────────────────────────
  # 2. Frontend (React/Vite via Nginx Docker)
  # ─────────────────────────────────────────────
  - type: web
    name: ai-sales-bot
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        value: https://ai-sales-bot-api.onrender.com
      - key: VITE_TESTING_MODE
        value: false

  # ─────────────────────────────────────────────
  # 3. Redis Cache & Celery Broker
  # ─────────────────────────────────────────────
  - type: redis
    name: ai-sales-bot-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
