services:
  # ─────────────────────────────────────────────
  # 1. Backend API (FastAPI)
  # ─────────────────────────────────────────────
  - type: web
    name: ai-sales-bot-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    # Use the production stage of the multi-stage Dockerfile
    dockerCommand: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: TESTING_MODE
        value: false
      # ── Databases (Supabase) ──
      # Set these manually in the Render dashboard
      - key: AUTH_DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      # ── Security ──
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      # ── Redis ──
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      # ── AI Keys ──
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # ── CORS ──
      - key: CORS_ORIGINS
        value: https://ai-sales-bot.onrender.com
      # ── Feature Flags ──
      - key: ENABLE_SUBSCRIPTION_LIMITS
        value: true
      - key: ENABLE_OVERAGE_BILLING
        value: true
      # ── Rate Limiting ──
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      # ── Optional integrations (set manually if needed) ──
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: WHATSAPP_BUSINESS_ID
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WA_GATEWAY_BASE_URL
        sync: false
      - key: WA_GATEWAY_API_KEY
        sync: false
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false

  # ─────────────────────────────────────────────
  # 2. Celery Worker (background task processor)
  # ─────────────────────────────────────────────
  - type: worker
    name: ai-sales-bot-celery-worker
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >
      sh -c "celery -A app.workers.celery_app worker --loglevel=info --concurrency=2"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SECRET_KEY
        sync: false

  # ─────────────────────────────────────────────
  # 3. Celery Beat (scheduled task runner)
  # ─────────────────────────────────────────────
  - type: worker
    name: ai-sales-bot-celery-beat
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: >
      sh -c "celery -A app.workers.celery_app beat --loglevel=info"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AUTH_DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: SECRET_KEY
        sync: false

  # ─────────────────────────────────────────────
  # 4. Frontend (React/Vite via Nginx Docker)
  # ─────────────────────────────────────────────
  - type: web
    name: ai-sales-bot
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./frontend/Dockerfile
    dockerContext: ./frontend
    envVars:
      - key: VITE_API_URL
        value: https://ai-sales-bot-api.onrender.com
      - key: VITE_TESTING_MODE
        value: false

  # ─────────────────────────────────────────────
  # 5. Redis Cache & Celery Broker
  # ─────────────────────────────────────────────
  - type: redis
    name: ai-sales-bot-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
