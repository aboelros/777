services:
  # ─────────────────────────────────────────────
  # 1. Backend API (FastAPI + Celery in one process)
  # Workers not available on free plan — Celery runs
  # as a background thread inside the web dyno.
  # ─────────────────────────────────────────────
  - type: web
    name: ai-sales-bot-api
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    dockerCommand: "bash render_start.sh"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: false
      - key: TESTING_MODE
        value: false
      # ── Databases (Supabase) ──
      - key: AUTH_DATABASE_URL
        sync: false
      - key: APP_DATABASE_URL
        sync: false
      # ── Security ──
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 15
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      # ── Redis ──
      - key: REDIS_URL
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: ai-sales-bot-redis
          property: connectionString
      # ── AI Keys ──
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # ── CORS — update with your actual Vercel URL after deploy ──
      - key: CORS_ORIGINS
        value: https://frontend-beryl-eta-37.vercel.app,https://admin-panel-ten-henna.vercel.app
      # ── Feature Flags ──
      - key: ENABLE_SUBSCRIPTION_LIMITS
        value: true
      - key: ENABLE_OVERAGE_BILLING
        value: true
      # ── Rate Limiting ──
      - key: RATE_LIMIT_PER_MINUTE
        value: 60
      # ── WhatsApp Gateway ──
      - key: WHATSAPP_BAILEYS_URL
        value: https://ai-sales-bot-whatsapp.onrender.com
      - key: WHATSAPP_BAILEYS_API_KEY
        fromService:
          type: web
          name: ai-sales-bot-whatsapp
          envVarKey: API_KEY
      - key: WHATSAPP_GATEWAY_CALLBACK_SECRET
        fromService:
          type: web
          name: ai-sales-bot-whatsapp
          envVarKey: CALLBACK_SECRET
      # NOTE: Per-user integrations (Telegram, WhatsApp, Shopify, etc.)
      # are stored in the database per project/user — NOT as env vars here.

  # Frontend is deployed separately on Vercel (not Render)

  # ─────────────────────────────────────────────
  # 2. Redis Cache & Celery Broker
  # ─────────────────────────────────────────────
  - type: redis
    name: ai-sales-bot-redis
    region: oregon
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  # ─────────────────────────────────────────────
  # 3. WhatsApp Gateway (Baileys)
  # Note: Render Free plan has ephemeral storage. Sessions will reset on deploy.
  # Upgrade to a paid plan and add a disk for persistent sessions.
  # ─────────────────────────────────────────────
  - type: web
    name: ai-sales-bot-whatsapp
    runtime: docker
    region: oregon
    plan: free
    branch: main
    dockerfilePath: ./whatsapp-gateway/Dockerfile
    dockerContext: ./whatsapp-gateway
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: CALLBACK_SECRET
        generateValue: true
      - key: BACKEND_URL
        # Replace with your actual backend URL once deployed
        value: https://ai-sales-bot-api.onrender.com
      - key: SESSION_DIR
        value: ./sessions
      - key: LOG_LEVEL
        value: info
