name: automind
description: "Automind Mobile — AI-Powered Sales Automation & Operations Control Center"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Architecture & State Management
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Networking & Real-Time
  dio: ^5.8.0+1
  web_socket_channel: ^3.0.3

  # Security & Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # UI, Icons, Typography & Charts
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.17
  fl_chart: ^0.69.2
  shimmer: ^3.0.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
